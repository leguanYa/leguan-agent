spring:
  application:
    name: leguan-agent
  profiles:
    active: local
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: gemma3:1b
    openai:
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      api-key: your-api-key
      chat:
        options:
          model: qwen3.5-flash
      embedding:
        options:
          model: text-embedding-v2
    dashscope:
      api-key: your-api-key
    vectorstore:
      pgvector:
        index-type: HNSW
        dimensions: 1536
        distance-type: COSINE_DISTANCE
        max-document-batch-size: 10000 # Optional: Maximum number of documents per batch
    mcp:
      client:
#        request-timeout: 20s
        sse:
          connections:
            server1:
              url: http://127.0.0.1:8122
  #        stdio:
#          servers-configuration: classpath:mcp-servers.json # 注意里面的 "command": windows为"npx.cmd",MAC和linux没有cmd后缀,
  datasource:
    dynamic:
      primary: mysql   # 默认数据源
      datasource:
        mysql:
          url: jdbc:mysql://127.0.0.1:3306/leguan_agent?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
          username: root
          password: root
          driver-class-name: com.mysql.cj.jdbc.Driver

        postgres:
          url: jdbc:postgresql://127.0.0.1:5432/leguan_agent
          username: postgres
          password: root
          driver-class-name: org.postgresql.Driver


  data:
    redis:
      url: redis://127.0.0.1:6379

logging:
  level:
    org.springframework.ai: DEBUG
    org.springframework.web.client: DEBUG
    org.springframework.web.reactive.function.client: DEBUG

leguan:
  github:
    token: your_github_token

# searchApi
search-api:
  api-key: 你的 API Key





server:
  port: 8123
  servlet:
    contextPath: /api


# springdoc-openapi
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.leguan.agent.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn

